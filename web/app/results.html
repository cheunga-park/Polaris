<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Polaris results</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="top"><div class="brand"><b>Polaris</b><span>results</span></div><nav><a href="/">Environments</a><a href="/robot.html">Robot</a><a href="/scan.html">New scan</a><a class="on" href="/results.html">Results</a><a href="/compose-environments/" target="_blank">Compose</a></nav></header>
<main>
  <h1>Evaluation runs</h1>
  <p class="muted">업스트림 <code>scripts/eval.py</code> 가 MuJoCo 위에서 쓴 <code>runs/&lt;name&gt;/&lt;env&gt;/eval_results.csv</code> 와 에피소드 영상. 성공률은 Wilson 90 % 구간, 진행도는 루브릭 기준 도달 비율(max-ever).</p>
  <div id="list"></div>
</main>
<script>
async function refresh() {
  const runs = await (await fetch('/api/runs')).json();
  document.getElementById('list').innerHTML = runs.length ? runs.map(r => `
    <div class="card" style="padding:12px 14px; margin-bottom:10px">
      <div class="title">${r.run}</div>
      <div class="row"><span class="k">episodes</span><span>${r.episodes}</span></div>
      <div class="row"><span class="k">success</span><span>${r.successes}/${r.episodes} = ${(100*r.success_rate).toFixed(0)} %  (Wilson 90 %: ${(100*r.wilson90[0]).toFixed(0)}–${(100*r.wilson90[1]).toFixed(0)} %)</span></div>
      <div class="row"><span class="k">mean progress</span><span>${r.mean_progress.toFixed(3)}</span></div>
      <div class="row"><span class="k">progress histogram</span><span>${r.progress_bins.map((b,i) => `${b.toFixed(2)}×${r.progress_hist[i]}`).join('  ')}</span></div>
      <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px">${r.videos.slice(0, 12).map(v => `<a href="/runs/${r.run}/${v}" target="_blank">${v.replace('.mp4','')}</a>`).join('')}${r.videos.length > 12 ? ` … ${r.videos.length} videos` : ''}</div>
    </div>`).join('') : '<p class="muted">no runs yet — <code>scripts/eval_batch.sh</code></p>';
}
refresh(); setInterval(refresh, 10000);
</script>
</body></html>
