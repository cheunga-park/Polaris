[project]
name = "polaris-v2s"
version = "0.1.0"
description = "PolaRiS-style video-to-sim: phone video -> 2DGS splat + mesh -> composed environment -> MuJoCo evaluation, with a web console"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2",
  "opencv-python-headless>=4.11",
  "pyyaml>=6",
  "trimesh>=4.6",
  "scipy>=1.13",
  "fast-simplification>=0.1.9",
  "pillow>=10",
  "usd-core>=25",
  "plyfile>=1.1",
  "huggingface_hub>=0.30",
  "tyro>=0.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.6",
  "mediapy>=1.2",
  "pandas>=2.2",
  "gymnasium>=1.0",
  "mujoco>=3.3",
  "coacd>=1.0.5",
  "pycolmap>=3.11",
  "torch>=2.8",
  "torchvision>=0.23",
  "ninja>=1.11",
  # upstream CUDA kernels (unmodified, editable, JIT-compiled on first import)
  "diff-surfel-rasterization",
  "simple-knn",
  "openpi-client",
]

[project.optional-dependencies]
# heavy perception stacks, installed on demand
perception = ["sam2>=1.1"]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27", "playwright>=1.50"]

[project.scripts]
polaris-v2s = "polaris_v2s.cli:main"
polaris-mujoco = "polaris_mujoco.run:main"

[tool.uv]
package = true
# openpi-client pins numpy<2 and depends on the abandoned `tree` package (needs pkg_resources to
# build); upstream polaris overrides its own deps the same way. numpy 2 works for the client's
# msgpack/image helpers.
override-dependencies = ["numpy>=2", "tree; sys_platform == 'never'"]

[tool.uv.sources]
diff-surfel-rasterization = { path = "third_party/polaris/src/diff-surfel-rasterization", editable = true }
simple-knn = { path = "third_party/polaris/src/simple-knn", editable = true }
openpi-client = { path = "third_party/polaris/third_party/openpi/packages/openpi-client", editable = true }
torch = { index = "torch-cu128" }
torchvision = { index = "torch-cu128" }

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polaris_v2s", "polaris_mujoco"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
