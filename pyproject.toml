[project]
name = "polaris-v2s"
version = "0.1.0"
description = "PolaRiS-style video-to-sim: phone video -> 2DGS splat + mesh -> composed environment -> MuJoCo evaluation, with a web console"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2",
  "opencv-python-headless>=4.11",
  "pyyaml>=6",
  "trimesh>=4.6",
  "usd-core>=25",
  "plyfile>=1.1",
  "huggingface_hub>=0.30",
  "tyro>=0.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.6",
  "mediapy>=1.2",
  "pandas>=2.2",
  "gymnasium>=1.0",
  "mujoco>=3.3",
  "coacd>=1.0.5",
  "torch>=2.8",
  "torchvision>=0.23",
]

[project.optional-dependencies]
# heavy perception stacks, installed on demand
sam2 = ["sam2>=1.1"]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]

[project.scripts]
polaris-v2s = "polaris_v2s.cli:main"
polaris-mujoco = "polaris_mujoco.run:main"

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "torch-cu128" }
torchvision = { index = "torch-cu128" }

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polaris_v2s", "polaris_mujoco"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
